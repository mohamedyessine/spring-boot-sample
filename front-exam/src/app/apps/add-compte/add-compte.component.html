<div>
    <div class="flex flex-col gap-2.5 xl:flex-row">
        <div class="panel flex-1 px-0 py-6 ltr:xl:mr-6 rtl:xl:ml-6">
            <div class="flex flex-wrap justify-between px-4">
                <div class="mb-6 w-full lg:w-1/2">
                    <div class="flex shrink-0 items-center text-black dark:text-white">
                        <img src="/assets/images/logo.png" alt="" class="w-14" />
                    </div>
                    <div class="mt-6 space-y-1 text-gray-500 dark:text-gray-400">
                        <div>exam.io</div>
                        <div>+1 (070) 123-4567</div>
                    </div>
                </div>
            </div>
            <hr class="my-6 border-[#e0e6ed] dark:border-[#1b2e4b]" />
            <div class="mt-8 px-4">
                <div class="flex flex-col lg:flex-row">
                    <div class="mb-6 w-full lg:w-full">
                        <div class="text-lg">Compte :</div>
                        <div class="mt-4 flex items-center">
                            <label for="rib" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">RIB</label>
                            <input id="rib" type="text" name="rib" class="form-input flex-1" placeholder="Entrez le rib"
                                [(ngModel)]="compte.rib" />
                        </div>
                        <div class="mt-4 flex items-center">
                            <label for="solde" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">Solde</label>
                            <input id="solde" type="text" name="solde" class="form-input flex-1"
                                placeholder="Entrez le solde" [(ngModel)]="compte.solde" />
                        </div>
                        <div class="mt-4">
                            <div class="flex items-center">
                                <label for="client" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">Client<span
                                        class="text-red-500">*</span></label>
                                <ng-select [items]="clients" [(ngModel)]="selectedClient" [clearable]="false"
                                    placeholder="Select an option" class="form-input flex-1" [bindLabel]="'cin'"
                                    [bindValue]="'id'" (change)="onClientSelected($event)">
                                </ng-select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 px-4 flex justify-end">
                <button type="button" class="btn btn-primary"
                    [disabled]="!isFormCompteValid() || isLoading"
                    (click)="saveCompte()">Ajouter Compte</button>
                <button type="button" class="btn btn-danger ml-3" (click)="resetFields()">Annuler</button>
            </div>
        </div>
    </div>
</div>
