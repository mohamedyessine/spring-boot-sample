<div>
    <div class="flex flex-col gap-2.5 xl:flex-row">
        <div class="panel flex-1 px-0 py-6 ltr:xl:mr-6 rtl:xl:ml-6">
            <div class="flex flex-wrap justify-between px-4">
                <!-- Section En-tête (Header) -->
                <div class="mb-6 w-full lg:w-1/2">
                    <div class="flex shrink-0 items-center text-black dark:text-white">
                        <img src="/assets/images/logo.png" alt="" class="w-14" />
                    </div>
                    <div class="mt-6 space-y-1 text-gray-500 dark:text-gray-400">
                        <div>exam.io</div>
                        <div>+1 (070) 123-4567</div>
                    </div>
                </div>
            </div>
            <hr class="my-6 border-[#e0e6ed] dark:border-[#1b2e4b]" />
            <div class="mt-8 px-4">
                <div class="flex flex-col lg:flex-row">
                    <!-- Client Form -->
                    <div class="mb-6 w-full lg:w-full">
                        <div class="text-lg">Client :</div>
                        <div class="mt-4 flex items-center">
                            <label for="cin" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">CIN</label>
                            <input id="cin" type="text" name="cin" class="form-input flex-1" placeholder="Entrez le CIN"
                                [(ngModel)]="client.cin" />
                        </div>
                        <div class="mt-4 flex items-center">
                            <label for="firstName" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">First Name</label>
                            <input id="firstName" type="text" name="firstName" class="form-input flex-1"
                                placeholder="Entrez le first name" [(ngModel)]="client.firstName" />
                        </div>
                        <div class="mt-4 flex items-center">
                            <label for="lastName" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">Last Name</label>
                            <input id="lastName" type="text" name="lastName" class="form-input flex-1"
                                placeholder="Entrez le last name" [(ngModel)]="client.lastName" />
                        </div>
                    </div>
                </div>

                <!-- Compte Form -->
                <div class="mt-8 px-4">
                    <div class="text-lg">Comptes :</div>
                    <div *ngFor="let compte of comptes; let i = index" class="mt-4 flex items-center">
                        <label for="rib-{{ i }}" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2">RIB</label>
                        <input id="rib-{{ i }}" type="text" name="rib-{{ i }}" class="form-input flex-1"
                            placeholder="Entrez le RIB" [(ngModel)]="compte.rib" />

                        <label for="solde-{{ i }}" class="mb-0 w-1/3 ltr:mr-2 rtl:ml-2 ml-4">Solde</label>
                        <input id="solde-{{ i }}" type="number" name="solde-{{ i }}" class="form-input flex-1"
                            placeholder="Entrez le Solde" [(ngModel)]="compte.solde" />

                        <button type="button" class="btn btn-danger ml-3" (click)="removeCompte(i)">Supprimer</button>
                    </div>
                    <button type="button" class="btn btn-secondary mt-4" (click)="addCompte()">Ajouter Compte</button>
                </div>
            </div>

            <!-- Bouton Soumettre -->
            <div class="mt-8 px-4 flex justify-end">
                <button type="button" class="btn btn-primary"
                    [disabled]="!isFormClientValid() || isLoading"
                    (click)="saveClientWithCompte()">Ajouter Sortie</button>
                <button type="button" class="btn btn-danger ml-3" (click)="resetFields()">Annuler</button>
            </div>
        </div>
    </div>
</div>
