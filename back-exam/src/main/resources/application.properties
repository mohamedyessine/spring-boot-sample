# Name
spring.application.name=exam

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/examdb?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=wadii
spring.datasource.password=wadii
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger
springdoc.swagger-ui.path=/exam-documentation
springdoc.api-docs.path=/exam-api-docs
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
exam.openapi.dev-url=http://localhost:8081
exam.openapi.prod-url=https://localhost:8081

#port
server.port=8081